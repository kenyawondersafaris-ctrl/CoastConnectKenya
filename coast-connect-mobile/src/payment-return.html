<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Payment Confirmation | Coast Connect Kenya
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f6f8f7;
      color: #17221d;
    }

    .payment-return-card {
      width: 100%;
      max-width: 460px;

      padding: 36px 28px;

      background: #ffffff;

      border: 1px solid #e2e8e5;
      border-radius: 18px;

      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    .payment-return-icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #eef8f3;
      color: #1f7a5a;

      font-size: 28px;
      font-weight: 800;
    }

    .payment-return-card h1 {
      margin: 0 0 10px;

      font-size: 1.45rem;
    }

    .payment-return-card p {
      margin: 0;

      color: #66736c;

      font-size: 0.95rem;
      line-height: 1.6;
    }

    .payment-return-loader {
      width: 34px;
      height: 34px;

      margin: 24px auto 0;

      border: 3px solid #dfe8e3;
      border-top-color: #1f7a5a;
      border-radius: 50%;

      animation:
        paymentSpin 0.8s linear infinite;
    }

    .payment-return-button {
      display: none;

      width: 100%;

      margin-top: 24px;
      padding: 13px 18px;

      border: 0;
      border-radius: 10px;

      background: #1f7a5a;
      color: #ffffff;

      font-size: 0.95rem;
      font-weight: 700;

      cursor: pointer;
    }

    @keyframes paymentSpin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>


<body>

  <main class="payment-return-card">

    <div
      id="paymentReturnIcon"
      class="payment-return-icon"
    >
      ✓
    </div>

    <h1 id="paymentReturnTitle">
      Verifying your payment
    </h1>

    <p id="paymentReturnMessage">
      Please wait while Coast Connect confirms your
      payment securely.
    </p>

    <div
      id="paymentReturnLoader"
      class="payment-return-loader"
    ></div>

    <button
      type="button"
      id="paymentReturnButton"
      class="payment-return-button"
    >
      Try Again
    </button>

  </main>


  <script src="js/payment-return.js"></script>

</body>

</html>
