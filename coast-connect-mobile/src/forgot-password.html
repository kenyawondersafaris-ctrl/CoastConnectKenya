<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Forgot Password | Coast Connect Kenya
  </title>

  <link
    rel="stylesheet"
    href="css/login.css"
  >
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <a
        href="index.html"
        class="brand"
      >
        Coast Connect Kenya
      </a>

      <div class="login-heading">
        <span class="eyebrow">
          Account Recovery
        </span>

        <h1>
          Forgot your password?
        </h1>

        <p>
          Enter the email address linked to your
          Coast Connect account. We’ll send you a
          6-digit password reset code.
        </p>
      </div>

      <div
        id="forgotPasswordMessage"
        class="login-message"
        role="alert"
        aria-live="polite"
      ></div>

      <form
        id="forgotPasswordForm"
        class="login-form"
        novalidate
      >
        <div class="form-group">
          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <button
          type="submit"
          id="forgotPasswordButton"
          class="login-button"
        >
          Send reset code
        </button>
      </form>

      <p class="login-footer">
        Remember your password?
        <a href="login.html">
          Sign in
        </a>
      </p>

      <a
        href="index.html"
        class="back-home"
      >
        Return to homepage
      </a>
    </section>
  </main>

  <script src="js/forgot-password.js"></script>
</body>
</html>
