<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Reset Password | Coast Connect Kenya
  </title>

  <link
    rel="stylesheet"
    href="css/login.css"
  >
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <a
        href="index.html"
        class="brand"
      >
        Coast Connect Kenya
      </a>

      <div class="login-heading">
        <span class="eyebrow">
          Password Reset
        </span>

        <h1>
          Create a new password
        </h1>

        <p>
          Enter the 6-digit code sent to your email,
          then choose a new password.
        </p>
      </div>

      <div
        id="resetPasswordMessage"
        class="login-message"
        role="alert"
        aria-live="polite"
      ></div>

      <form
        id="resetPasswordForm"
        class="login-form"
        novalidate
      >
        <div class="form-group">
          <label for="code">
            6-digit reset code
          </label>

          <input
            type="text"
            id="code"
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="123456"
            maxlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            New password
          </label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter new password"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">
            Confirm new password
          </label>

          <div class="password-field">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm new password"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              id="toggleConfirmPassword"
              class="password-toggle"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="resetPasswordButton"
          class="login-button"
        >
          Reset password
        </button>
      </form>

      <p class="login-footer">
        Didn’t receive a code?
        <a href="forgot-password.html">
          Request another
        </a>
      </p>

      <a
        href="login.html"
        class="back-home"
      >
        Back to sign in
      </a>
    </section>
  </main>

  <script src="js/reset-password.js"></script>
</body>
</html>
