<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sign In | Coast Connect Kenya</title>

  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <a href="index.html" class="brand">
        Coast Connect Kenya
      </a>

      <div class="login-heading">
        <span class="eyebrow">Coast Connect Account</span>

        <h1>Welcome back</h1>

        <p>
          Sign in to access your Coast Connect account,
          dashboard, orders, bookings, and services.
        </p>
      </div>

      <div
        id="loginMessage"
        class="login-message"
        role="alert"
        aria-live="polite"
      ></div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="8"
              required
            />

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          Sign in
        </button>
      </form>

      <p class="login-footer">
        New to Coast Connect Kenya?
        <a href="join.html">Create an account</a>
      </p>

      <a href="index.html" class="back-home">
        Return to homepage
      </a>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
